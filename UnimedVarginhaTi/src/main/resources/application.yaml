server:
  port: 8080

spring:
  # Valores desta maquina -- senha do banco local, segredo de teste. Fica em
  # UnimedVarginhaTi/application-local.yaml, FORA de resources: dentro de
  # resources o Maven o empacotaria dentro do JAR, e a senha sairia junto com o
  # artefato. Lido do disco, ele nunca entra no build. Opcional: no servidor nao
  # existe e tudo vem de variavel de ambiente, que tem precedencia sobre ele.
  config:
    import: optional:file:./application-local.yaml

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  application:
    name: gestao-setor-api

  # O schema é versionado em db/migration. baseline-on-migrate cobre o banco de
  # desenvolvimento que já existia antes do Flyway: se ele tiver tabelas e nenhum
  # histórico, é marcado como já estando na V1 em vez de tentar recriá-la.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/SystemTI?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    # Sem padrao, de proposito. A senha que ficava aqui foi parar no historico de
    # um repositorio publico, e um default faz exatamente isso: transforma a
    # senha em codigo. Sem DB_PASSWORD definida o sistema recusa subir, com o
    # nome da variavel que falta -- melhor do que subir calado com uma senha que
    # qualquer um conhece.
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # Consultar o banco durante a renderizacao esconde N+1 e segura a conexao
    # aberta mais tempo que o necessario. Os services ja carregam o que precisam.
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      # validate: o Hibernate confere se as entidades batem com o schema criado
      # pelas migrations, mas nunca altera o banco. Não volte para update/create —
      # isso reescreveria o schema por baixo das migrations.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  mail:
    host: smtp-mail.outlook.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# O healthcheck do container e o unico consumidor disto. Exposto so o health:
# os demais endpoints do actuator contam versao, variaveis de ambiente e beans,
# e nada disso precisa estar de pe para o Docker saber se o sistema responde.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    # O check de e-mail tenta autenticar no SMTP a cada consulta. Com
    # MAIL_PASSWORD em branco ele falha, e um health DOWN por causa do
    # "esqueci minha senha" faria o Docker tratar o sistema inteiro como
    # quebrado -- com a tela e o banco funcionando. O que precisa entrar no
    # health e o que derruba o sistema: o banco, que continua sendo checado.
    mail:
      enabled: false

# Primeiro acesso de uma instalacao nova. So vale enquanto a tabela de usuarios
# esta vazia: assim que existir uma pessoa cadastrada, estas variaveis nao fazem
# mais nada. Ver AdminInicial.
admin-inicial:
  login: ${ADMIN_LOGIN:}
  senha: ${ADMIN_SENHA:}
  nome: ${ADMIN_NOME:Administrador}
  email: ${ADMIN_EMAIL:}

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

api:
  security:
    token:
      # Sem padrao: com um segredo publicado, qualquer um que conheca o projeto
      # forja um token de administrador. O antigo "change-me-in-production" era
      # pior que nenhum, porque deixava o sistema subir parecendo configurado.
      # Trocar o segredo invalida os tokens em uso: quem estiver logado entra de
      # novo -- so isso.
      secret: ${JWT_SECRET}

  cors:
    # Os enderecos pelos quais o sistema e aberto no navegador, separados por
    # virgula. No servidor da rede: http://nome-do-servidor:8080
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

