server:
  port: 0

spring:
  application:
    name: gestao-setor-api-test

  flyway:
    enabled: false

  datasource:
    url: jdbc:h2:mem:systemti-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  mail:
    host: localhost
    port: 1025
    username:
    password:

file:
  upload-dir: ${java.io.tmpdir}/systemti-test-uploads

api:
  security:
    token:
      secret: test-secret
